# Render blueprint for the BHA engine dashboard: one web service that serves
# the built front end and the /api routes from the same origin.
#
# Secrets are set in the Render dashboard, never here. sync: false marks the
# ones you must fill in by hand.
services:
  - type: web
    name: bha-engine-dashboard
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # No disk. The read model, the status-change history and the observation
    # series are in Postgres (bha-engine-db, below) as of 2026-09-12; a mounted
    # disk on the old free instance was wiped on every deploy and every
    # spin-down anyway, which is what this replaces.
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # DATABASE_URL is deliberately NOT declared here.
      #
      # It is set on the service by hand, via Add from database against
      # bha-engine-db. That link tracks the database: if the credentials
      # rotate, the service's value follows. A blueprint literal cannot, and
      # two sources on the same key is how a value silently flips back on a
      # later redeploy.
      #
      # The server refuses to boot without it — a missing or unreachable
      # DATABASE_URL prints the reason and exits rather than falling back to a
      # store that loses writes. So its absence from this file is not an
      # oversight: it is the one variable this blueprint must not own.
      #
      # The rule this follows: secrets and linked resources stay out of the
      # blueprint; non-secret config stays in it.
      - key: AUTH_EMAIL
        value: admin@bhanetwork.org
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # The company n8n instance. n8n.arupiautomates.cloud is retired; the
      # dashboard pointed at it until 2026-09-12 because nothing set this
      # variable and the code's own fallback still named the old host. The
      # fallback in server/src/ask.ts now names this same instance, so a
      # process that sets nothing still reaches a live host.
      - key: ASK_BAYS_URL
        value: https://bayshorizonnetwork.app.n8n.cloud/webhook/dashboard-ask-bays
      - key: ASK_BAYS_API_KEY
        sync: false
      - key: ASK_BAYS_MODEL_LABEL
        value: Claude Sonnet 5.0
      # Base for the "view execution" links on fixture-backed rows. Non-secret
      # config, so it belongs here. Execution ids recorded before the move off
      # n8n.arupiautomates.cloud do not exist on this instance and will 404 —
      # known and accepted, see src/data/fixtures/common.ts.
      - key: N8N_BASE_URL
        value: https://bayshorizonnetwork.app.n8n.cloud
      # The engine's own service key. n8n sends it in x-dashboard-key on every
      # write to /api/engine/*, and it is the only way a record reaches this
      # dashboard since the Airtable sync was removed on 2026-09-13 — without
      # it the record tables stay exactly as the migration backfill left them.
      # AIRTABLE_API_KEY and AIRTABLE_RESYNC_MINUTES went with that sync; they
      # can be removed from the service's environment by hand, since a key
      # dropped from this blueprint is left in place on Render rather than
      # deleted.
      - key: DASHBOARD_INBOUND_KEY
        generateValue: true
      # The n8n instance API key, for the Executions page (15 Sep 2026).
      # READ ONLY: the two endpoints used are GET /api/v1/executions and
      # GET /api/v1/workflows (names only) and nothing here can write to n8n.
      #
      # A different credential from ASK_BAYS_API_KEY — that is a webhook header,
      # this is an instance API key from Settings → n8n API. Without it no
      # execution is ever read, and the Executions and Engine health pages say
      # so rather than reading zero.
      #
      # It exists because n8n's execution history does not persist: on 15 Sep
      # 2026 the instance held 3,673 executions and none older than the 12th, so
      # a page that queried it live for August would draw an empty month for a
      # month that was busy. The counts are snapshotted into engine_executions
      # hourly and the pages read that.
      - key: N8N_API_KEY
        sync: false
      # The BHARAG incident ledger, for Engine health (17 Sep 2026). Read only,
      # and the second external read path this server has after Airtable.
      #
      # **One key per lane, and they are not interchangeable.** Each of the
      # three error handlers holds its own BHARAG credential and a key for one
      # lane is refused for another, so the server reads three times with three
      # keys. No defaults: a guessed key is a 401, which reads on the page like
      # the ledger refusing the lane rather than like this service being
      # misconfigured.
      #
      # A lane with no key is never read, and the page says so rather than
      # drawing it healthy — no incidents and no reporting look identical from
      # the outside, and only one of them is good news. The boot line names
      # every lane that is not keyed.
      - key: BHARAG_BAYS_KEY
        sync: false
      - key: BHARAG_NORTH_STAR_KEY
        sync: false
      - key: BHARAG_RESEARCH_TWIN_KEY
        sync: false
      # The Airtable token, for loop and Codex edits (2026-09-14). The n8n
      # write-back that stood here for a day is retired: the loop panel edits
      # four fields and can move a row between builder tables, and routing that
      # through a webhook left no way to see where a half-completed move
      # stopped.
      #
      # **It needs data.records:read and :write on BOTH bases** — Open Loops
      # AND BHA Submissions (appEmdKshNVTl64Zf). This comment said "the Open
      # Loops base and nothing else" until 14 Sep, which is what a token made
      # from these instructions would have been scoped to; the Codex page's
      # reconciliation then failed on every one of its seven table reads.
      #
      # And data.records:READ — read only — on five more, for the resync
      # button Build patterns, Commercial and Clients gained on 15 Sep and
      # the two twins gained on 16 Sep:
      #   app5ni3E8r7Lvxk22  Build Patterns
      #   appvLglfdCqOKqLpT  Commercial Opportunities
      #   appkSUSh9ijNjP2f8  BHA Client Research Loop
      #   appRvx4u9V9BYp646  BHA North Star Ledger      (Asks)
      #   appv39nQzmfC9VVkG  BHA Research Twin Ledger   (Asks AND Research Jobs)
      #   appINvgEoZjuYQI2O  engine_events              (error_counts AND
      #                                                  retry_attempts, for
      #                                                  Engine health, 17 Sep)
      #   appwnt0mEtfwDtcN5  BHA Pay Ledger             (Builders, Sessions AND
      #                                                  Monthly Statements, for
      #                                                  Pay Tracker, 17 Sep)
      # Nothing is ever written to the pay ledger: paid status is set by the
      # Slack card or by a statement closing, and the dashboard is read-only on
      # pay by design.
      # The last two changed on 17 Sep 2026, when both twins moved onto their
      # own ledgers. The five [LEGACY] bases they read until then —
      # appkCTjhH8PtYRFI7, appud969Dw7H4tMwv, app4QnMJ2woiKlLc0,
      # appSoakKvs7MLkRnX, appxkIgnLL1zBsXqD — are read by nothing here now.
      # **A token still scoped to the old two authenticates and then refuses
      # both twins' resyncs**, the same failure the submissions base had on
      # 14 Sep, so re-check the scope rather than assuming it carried over.
      # Nothing is written to those five, so they get no base variable of
      # their own: this server can never write to a guess about them. A token
      # without read on one makes that page's resync refuse and name the
      # table; it never reads a refusal as an emptied table.
      #
      # Note the name: the client deleted on 13 Sep read AIRTABLE_API_KEY. This
      # reads AIRTABLE_TOKEN, which is the variable actually set on the service.
      # Without it the server says so at boot and every loop edit is marked as
      # not having reached Airtable.
      - key: AIRTABLE_TOKEN
        sync: false
      # One variable per base, each named for its base (2026-09-14, Destiny), so
      # the next Airtable base to arrive cannot be mistaken for one of these.
      # AIRTABLE_BASE_ID is the old name of the first one and is read by
      # nothing now; a key dropped from this blueprint is left in place on
      # Render rather than deleted, so remove it there by hand.
      #
      # The server has no built-in default for the loops base: a default is a
      # guess about which base real loops are written to. Without this variable
      # the boot line says so by name and every loop edit is refused and marked.
      - key: AIRTABLE_OPEN_LOOPS_BASE_ID
        value: appUVlBSGGPHw6DGh
      # BHA Submissions & Logs — the Codex base. Same token covers both.
      - key: AIRTABLE_SUBMISSIONS_BASE_ID
        value: appEmdKshNVTl64Zf
      # The MCP server's path secret (18 Sep 2026). The endpoint is
      # /mcp/<MCP_SECRET> on this same service — an MCP server mounted on the
      # existing handler, not a second service, so it deploys with this commit
      # and runs in this process against this database.
      #
      # sync: false rather than generateValue: true, deliberately: the value
      # has to go into the Claude connector URL as well, so it is set by hand
      # in both places and a generated one nobody can read would leave the
      # connector pointing at a 404.
      #
      # No default in the code. Unset, every request under /mcp gets a 404 and
      # the boot line names the variable. A wrong secret gets the same 404 a
      # wrong route gets, so the endpoint is not discoverable.
      - key: MCP_SECRET
        sync: false
      # vFarm Early Access (20 Sep 2026). The n8n webhook that posts a new
      # lead into #vfarm-early-access. sync: false — it is a webhook URL with
      # its own Slack credential behind it, and no Slack token belongs in this
      # repo. Unset, the endpoint still works and leads arrive unannounced,
      # which the boot line and the row both say.
      - key: EARLY_ACCESS_NOTIFY_URL
        sync: false
      # The salt for the stored ip_hash. generateValue, like SESSION_SECRET:
      # nobody needs to read it, and it must not be a value somebody picked.
      # Unset, a random one is generated per process and stored hashes stop
      # comparing across a restart.
      - key: IP_HASH_SALT
        generateValue: true
      # EARLY_ACCESS_ALLOWED_ORIGINS is deliberately not declared. The three
      # origins the form is served from are the code's own default, so the
      # variable only exists to add or remove one — and a blueprint literal
      # that repeats a default is a second place for it to drift.

# Confirmed against the live Render API (2026-09-12), not inferred: the plan
# string is the one the API reports. basic-256mb is an accepted alias for the
# same tier; this is the canonical form. The database and the web service share
# environment evm-dai49rmq1p3s73b2al2g, which is what makes the internal
# connection string above resolve — no ipAllowList entries exist and none are
# needed, because nothing connects from outside that environment.
databases:
  - name: bha-engine-db
    databaseName: bha_engine_db
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    region: oregon
    # Disk autoscaling is enabled on the instance, so this is the floor rather
    # than the ceiling.
    diskSizeGB: 1
