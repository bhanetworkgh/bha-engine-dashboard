# Render blueprint for the BHA engine dashboard: one web service that serves
# the built front end and the /api routes from the same origin.
#
# Secrets are set in the Render dashboard, never here. sync: false marks the
# ones you must fill in by hand.
services:
  - type: web
    name: bha-engine-dashboard
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    # No disk. The read model, the status-change history and the observation
    # series are in Postgres (bha-engine-db, below) as of 2026-09-12; a mounted
    # disk on the old free instance was wiped on every deploy and every
    # spin-down anyway, which is what this replaces.
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      # The one thing the server cannot start without. It refuses to boot if
      # this is missing or the database is unreachable, rather than falling
      # back to a store that loses writes silently. Use the INTERNAL URL: the
      # host is a single label (dpg-…-a), carries no TLS, and only resolves
      # from a service in the same Render region.
      - key: DATABASE_URL
        fromDatabase:
          name: bha-engine-db
          property: connectionString
      - key: AUTH_EMAIL
        value: admin@bhanetwork.org
      - key: AUTH_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ASK_BAYS_URL
        value: https://n8n.arupiautomates.cloud/webhook/dashboard-ask-bays
      - key: ASK_BAYS_API_KEY
        sync: false
      - key: ASK_BAYS_MODEL_LABEL
        value: Claude Sonnet 5.0
      # Airtable is the source of truth for every record kind. The token needs
      # data.records:read on all seven bases, and :write on the four the
      # dashboard writes back to:
      #   appUVlBSGGPHw6DGh  loops               read + write
      #   appEmdKshNVTl64Zf  Codex submissions   read + write
      #   app5ni3E8r7Lvxk22  build patterns      read + write
      #   appvLglfdCqOKqLpT  commercial          read + write
      #   appkCTjhH8PtYRFI7  NS Records          read
      #   appud969Dw7H4tMwv  Research Queue      read
      #   appkSUSh9ijNjP2f8  watched clients     read
      # The last three were added on 2026-09-10; a token scoped to only the
      # original four leaves North Star, Research Twin and Clients showing a
      # resync error rather than data.
      # The inbound key is what n8n sends in x-dashboard-key.
      - key: AIRTABLE_API_KEY
        sync: false
      # Fifteen minutes: ~31 Airtable requests a cycle across seven bases, far
      # under the five-per-second-per-base limit. Raise it if the workspace's
      # monthly API call ceiling becomes the binding constraint.
      - key: AIRTABLE_RESYNC_MINUTES
        value: "15"
      - key: DASHBOARD_INBOUND_KEY
        generateValue: true

# Confirmed against the live Render API (2026-09-12), not inferred: the plan
# string is the one the API reports. basic-256mb is an accepted alias for the
# same tier; this is the canonical form. The database and the web service share
# environment evm-dai49rmq1p3s73b2al2g, which is what makes the internal
# connection string above resolve — no ipAllowList entries exist and none are
# needed, because nothing connects from outside that environment.
databases:
  - name: bha-engine-db
    databaseName: bha_engine
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    region: oregon
    # Disk autoscaling is enabled on the instance, so this is the floor rather
    # than the ceiling.
    diskSizeGB: 1
